name: Build Android APK

# Run it from the Actions tab ("Run workflow") or by pushing a tag like v0.10.3.
# With the four signing secrets set (see docs/SIGNING.md) it builds a SIGNED RELEASE APK with your
# permanent key, so new versions install over old ones. Without them it builds a debug APK instead.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_ALIAS != '' && secrets.KEY_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Check the code
        run: |
          npm run typecheck
          npm test

      - name: Build the web app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - name: Create the Android project (first time only)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: App icon and splash screen
        run: npx @capacitor/assets generate --android --assetPath assets

      - name: Copy the web app into Android
        run: npx cap sync android

      # Android only installs an update over an installed app if its versionCode is higher,
      # so every build gets a rising number (the run number) and the package.json version as its name.
      - name: Set the app version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"[^\"]*\"/versionName \"${VERSION}\"/" android/app/build.gradle
          grep -nE "versionCode|versionName" android/app/build.gradle

      - name: Build the signed release APK
        if: env.HAS_KEY == 'true'
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign the APK with your key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/brushx.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/brushx.jks" --ks-pass env:KS_PASS --key-pass env:KEY_PASS --ks-key-alias "$KEY_ALIAS" --out brushx.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs brushx.apk
          rm -f "$RUNNER_TEMP/brushx.jks"

      - name: Build the debug APK (no signing key set)
        if: env.HAS_KEY != 'true'
        working-directory: android
        run: |
          echo "::warning::No signing key set, so this is a DEBUG build. Testers must uninstall before updating. See docs/SIGNING.md."
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../brushx.apk

      - uses: actions/upload-artifact@v4
        with:
          name: brushx-apk
          path: brushx.apk
          if-no-files-found: error

      # Pushing a tag (for example v0.10.3) also publishes a public download page for testers.
      - name: Publish a release with the APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: brushx.apk
          generate_release_notes: true
          prerelease: false
